<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utang Logs - Debt Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Utang Logs</h1>
            <p>Track your debts and payments</p>
        </header>

        <!-- Navigation -->
        <nav class="nav-bar">
            <button onclick="showSection('dashboard')" class="nav-btn active" id="navDashboard">
                📊 Dashboard
            </button>
            <button onclick="showSection('addBorrower')" class="nav-btn" id="navAddBorrower">
                👤 Add Borrower
            </button>
            <button onclick="showSection('addDebt')" class="nav-btn" id="navAddDebt">
                💰 Add Debt
            </button>
            <button onclick="showSection('addPayment')" class="nav-btn" id="navAddPayment">
                💵 Record Payment
            </button>
        </nav>

        <!-- ============================================ -->
        <!-- SECTION: DASHBOARD                           -->
        <!-- ============================================ -->
        <div id="sectionDashboard" class="section active">
            <!-- Quick Add Borrower -->
            <section class="form-section">
                <h2>Quick Add Borrower</h2>
                <form id="borrowerForm">
                    <div class="form-group">
                        <input type="text" id="borrowerName" placeholder="Borrower Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="borrowerContact" placeholder="Contact Info (optional)">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Borrower</button>
                </form>
            </section>

            <!-- Dashboard -->
            <section class="dashboard">
                <div class="dashboard-header">
                    <h2>📊 All Borrowers</h2>
                    <span class="count" id="borrowerCount">0 borrowers</span>
                </div>
                <div id="borrowerList">
                    <p>Loading borrowers...</p>
                </div>
            </section>
        </div>

        <!-- ============================================ -->
        <!-- SECTION: ADD BORROWER                        -->
        <!-- ============================================ -->
        <div id="sectionAddBorrower" class="section">
            <section class="form-section">
                <h2>👤 Add New Borrower</h2>
                <form id="borrowerForm2">
                    <div class="form-group">
                        <label>Borrower Name</label>
                        <input type="text" id="borrowerName2" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Info</label>
                        <input type="text" id="borrowerContact2" placeholder="Phone number or email (optional)">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Borrower</button>
                </form>
            </section>
        </div>

        <!-- ============================================ -->
        <!-- SECTION: ADD DEBT                            -->
        <!-- ============================================ -->
        <div id="sectionAddDebt" class="section">
            <section class="form-section">
                <h2>💰 Log New Debt</h2>
                <form id="debtForm">
                    <div class="form-group">
                        <label>Select Borrower</label>
                        <select id="debtBorrower" required>
                            <option value="">Select Borrower</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (₱)</label>
                        <input type="number" id="debtAmount" placeholder="0.00" required step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Reason/Item</label>
                        <input type="text" id="debtReason" placeholder="What was borrowed?" required>
                    </div>
                    <div class="form-group">
                        <label>Date Borrowed</label>
                        <input type="date" id="debtDate">
                    </div>
                    <button type="submit" class="btn btn-primary">Log Debt</button>
                </form>
            </section>
        </div>

        <!-- ============================================ -->
        <!-- SECTION: RECORD PAYMENT                      -->
        <!-- ============================================ -->
        <div id="sectionAddPayment" class="section">
            <section class="form-section">
                <h2>💵 Record Payment</h2>
                <form id="paymentForm">
                    <div class="form-group">
                        <label>Select Borrower</label>
                        <select id="paymentBorrower" required>
                            <option value="">Select Borrower</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Debt</label>
                        <select id="paymentDebt" required>
                            <option value="">Select Debt</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount Paid (₱)</label>
                        <input type="number" id="paymentAmount" placeholder="0.00" required step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Notes (optional)</label>
                        <input type="text" id="paymentNotes" placeholder="Payment reference or notes">
                    </div>
                    <button type="submit" class="btn btn-primary">Record Payment</button>
                </form>
            </section>
        </div>

        <!-- ============================================ -->
        <!-- DEBT DETAIL VIEW (Hidden by default)         -->
        <!-- ============================================ -->
        <div id="debtDetailView" class="debt-detail-view" style="display:none;">
            <button onclick="closeDebtDetail()" class="back-btn">← Back to Dashboard</button>
            <div id="debtDetailContent"></div>
        </div>

    </div>

    <!-- ============================================ -->
    <!-- EDIT DEBT MODAL                              -->
    <!-- ============================================ -->
    <div id="editDebtModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Edit Debt</h2>
                <button onclick="closeEditModal()" class="btn-close-modal">✕</button>
            </div>
            <div class="modal-body">
                <form id="editDebtForm">
                    <input type="hidden" id="editDebtId">
                    
                    <div class="form-group">
                        <label>Amount (₱)</label>
                        <input type="number" id="editAmount" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Reason/Item</label>
                        <input type="text" id="editReason" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Date Borrowed</label>
                        <input type="date" id="editDate">
                    </div>
                    
                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus">
                            <option value="Unpaid">Unpaid</option>
                            <option value="Partial">Partial</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>
                    
                    <div style="display:flex;gap:10px;margin-top:20px;">
                        <button type="button" onclick="closeEditModal()" class="btn btn-secondary" style="flex:1;">Cancel</button>
                        <button type="submit" class="btn btn-primary" style="flex:2;">💾 Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
